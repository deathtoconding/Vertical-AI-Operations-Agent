name: ci

# DEV-002 — the pull-request pipeline. Every stage is blocking: a failing stage fails the
# workflow, and a red workflow blocks merge (branch protection documented in
# docs/planning/release-gates.md). `make ci` runs the same stages locally.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  AIOPS_ENV: test
  AIOPS_AUTH_ENABLED: "false"

jobs:
  quality:
    name: lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Repository hygiene (large files, conflict markers, secrets)
        run: bash scripts/check_repo_hygiene.sh
      - name: Format check
        run: ruff format --check app tests evals scripts
      - name: Lint
        run: ruff check app tests evals scripts
      - name: Type check (strict)
        run: mypy

  test:
    name: tests (postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["16"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aiops
          POSTGRES_PASSWORD: aiops
          POSTGRES_DB: aiops
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aiops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AIOPS_DATABASE_URL: postgresql+psycopg://aiops:aiops@localhost:5432/aiops
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Plan contract (backlog + documentation)
        run: pytest tests/unit/planning -q
      - name: Unit tests
        run: pytest tests/unit -q -m "unit or not integration"
      - name: Migrations
        run: alembic -c app/persistence/alembic.ini upgrade head
      - name: Integration tests (real PostgreSQL)
        run: pytest tests/integration -q
      - name: Security tests
        run: pytest tests/security -q
      - name: End-to-end tests
        run: pytest tests/e2e -q
      - name: Coverage floor
        run: |
          pytest tests/unit tests/integration -q --cov=app --cov-report=term-missing \
            --cov-report=xml --cov-fail-under=75
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml

  build:
    name: container build
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v5
      - name: Build image (tagged with the commit SHA — immutable artifact, DEV-003)
        run: |
          docker build -f infra/docker/Dockerfile \
            -t aiops-agent:${{ github.sha }} \
            -t aiops-agent:ci .
      - name: Smoke-test the image (boots, serves /health)
        run: |
          docker run -d --name aiops-smoke -p 18000:8000 \
            -e AIOPS_ENV=test -e AIOPS_AUTH_ENABLED=false aiops-agent:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:18000/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:18000/health | tee /dev/stderr | grep -q '"status"'
          docker rm -f aiops-smoke
      - name: Save image for the CD workflow
        run: docker save aiops-agent:${{ github.sha }} -o /tmp/aiops-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: /tmp/aiops-image.tar
          retention-days: 5
