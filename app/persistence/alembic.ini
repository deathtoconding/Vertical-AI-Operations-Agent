# Alembic configuration for the AI Operations Agent.
# The URL is resolved in migrations/env.py from AIOPS_DATABASE_URL (or a local socket),
# so this file never contains a credential.
[alembic]
script_location = app/persistence/migrations
prepend_sys_path = .
version_path_separator = os
path_separator = os
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =

# No post-write hooks: the formatter runs in CI (`make fmt`), and requiring an installed
# console script here would make `alembic revision` fail in a minimal environment.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
