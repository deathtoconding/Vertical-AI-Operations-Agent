    stories: [OPS-001, OPS-002, OPS-010, OPS-011, DEV-001, DEV-002]
  - number: 2
    name: Integrations
    outcome: System can collect operational evidence.
    stories: [OPS-020, OPS-021, OPS-022, OPS-023, SRE-002]
  - number: 3
    name: Detection + SRE
    outcome: Operational anomalies become incidents, with metrics, SLOs and API hardening.
    stories: [OPS-030, OPS-031, SRE-001, SRE-004, SEC-001, SEC-006]
  - number: 4
    name: AI Investigation
    outcome: Agent can investigate incidents.
    stories: [OPS-040, OPS-041, OPS-050]
  - number: 5
    name: Controlled Actions
    outcome: Agent can propose and execute approved actions.
    stories: [OPS-051, OPS-060, OPS-061, OPS-062]
  - number: 6
    name: Verification + Reliability
    outcome: Agent can verify its actions and operate reliably.
    stories: [OPS-063, SRE-003, SRE-005, DEV-004]
  - number: 7
    name: Security
    outcome: Security controls become enforceable rather than aspirational.
    stories: [SEC-002, SEC-003, SEC-004, SEC-005]
  - number: 8
    name: Evaluation + CD
    outcome: AI regressions are detected automatically and releases are gated.
    stories: [EVAL-001, EVAL-002, EVAL-003, DEV-003]
  - number: 9
    name: Operations UI + Release
    outcome: Operators can run the system and the release is validated.
    stories: [UI-001, UI-002, UI-003, OPS-070]
