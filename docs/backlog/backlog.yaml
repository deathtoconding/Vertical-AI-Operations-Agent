# =============================================================================
# Jira-import-ready backlog — Vertical AI Operations Agent
# -----------------------------------------------------------------------------
# This file is the SINGLE SOURCE OF TRUTH for planning. It is:
#   * validated by tests/unit/planning/test_backlog.py  (schema, graph, sprint loads)
#   * converted to CSV for Jira import by  scripts/export_backlog.py
#   * the traceability root for tests (every test carries @pytest.mark.story("OPS-030"))
#
# Fields: id, type, epic, summary, description, acceptance_criteria, subtasks,
#         priority, points, sprint, dependencies, labels, security,
#         observability, test_approach, implemented_by
# =============================================================================
version: 2
project:
  key: AIOPS
  name: AI Operations Agent
  board: Vertical AI Operations Agent — SaaS Operations Engineer
  baseline: main
  point_model: [1, 2, 3, 5, 8, 13]      # Fibonacci; 13 must be split

epics:
  - id: EPIC-01
    key: OPS
    summary: Product & Domain Foundation
    priority: P0
    outcome: Agent behaviour is bounded by an explicit, documented SaaS operations domain.
  - id: EPIC-02
    key: OPS
    summary: Core Platform
    priority: P0
    outcome: A reproducible, observable FastAPI service backed by PostgreSQL.
  - id: EPIC-03
    key: OPS
    summary: Integrations
    priority: P0
    outcome: The system can collect operational evidence from external systems safely.
  - id: EPIC-04
    key: OPS
    summary: Detection
    priority: P0
    outcome: Operational anomalies become deduplicated, severity-scored incidents.
  - id: EPIC-05
    key: OPS
    summary: Investigation
    priority: P0
    outcome: Evidence becomes an evidence-backed, schema-validated diagnosis.
  - id: EPIC-06
    key: OPS
    summary: Agent Orchestration
    priority: P0
    outcome: Agent runs advance deterministically and recover safely when interrupted.
  - id: EPIC-07
    key: OPS
    summary: Actions & Verification
    priority: P0
    outcome: Only policy-permitted, approved actions execute, and they are independently verified.
  - id: EPIC-08
    key: OPS
    summary: Security / SecDevOps
    priority: P0
    outcome: Authorization, prompt-injection defence, audit and supply chain are enforceable.
  - id: EPIC-09
    key: OPS
    summary: SRE / Observability
    priority: P0
    outcome: Golden signals, agent signals, tracing, SLOs and runbooks exist.
  - id: EPIC-10
    key: OPS
    summary: DevOps / CI/CD
    priority: P0
    outcome: Reproducible build, tested rollback, and a gated release pipeline.
  - id: EPIC-11
    key: OPS
    summary: AI Evaluation
    priority: P0
    outcome: AI behaviour regressions are detected automatically on every change.
  - id: EPIC-12
    key: OPS
    summary: Operations UI
    priority: P1
    outcome: Operators can see incidents, approve actions, and follow agent activity.

stories:
  # ------------------------------------------------------------------ EPIC-01
  - id: OPS-001
    type: story
    epic: EPIC-01
    summary: Define SaaS operational domain
    description: >
      As an operations platform I need a clearly defined SaaS operational domain so that agent
      behaviour remains bounded and reviewable.
    acceptance_criteria:
      - Supported systems are documented (app, deployment platform, GitHub, Jira, Slack, metrics, logs, payments).
      - Supported incident types are documented (error spike, latency spike, subscription/payment anomaly).
      - Supported actions are documented, including which are blocked in the MVP.
      - Out-of-scope behaviour is documented explicitly.
      - Severity model (SEV1..SEV4) is documented with response expectations.
    subtasks: [Define domain model, Define incident taxonomy, Define severity levels, Define operational terminology, Document scope boundaries]
    priority: P0
    points: 3
    sprint: 1
    dependencies: []
    labels: [domain, docs, foundation]
    security: Scope boundaries limit what the agent may ever touch (least privilege by construction).
    observability: Domain terminology is shared with metric/log naming.
    test_approach: tests/unit/planning/test_documentation.py asserts the required domain contracts are documented and consistent with app.domain.enums.
    implemented_by: [docs/planning/domain.md, app/domain/enums.py]

  - id: OPS-002
    type: story
    epic: EPIC-01
    summary: Define agent lifecycle
    description: As an operator I need an explicit incident lifecycle so invalid transitions cannot occur.
    acceptance_criteria:
      - Valid transitions are defined for NEW, DETECTED, INVESTIGATING, PLANNED, WAITING_APPROVAL, EXECUTING, VERIFYING, RESOLVED, FAILED, ESCALATED.
      - Invalid transitions are rejected with a typed error.
      - Every transition is audited with actor, timestamp and reason.
    subtasks: [Enumerate states, Define transition table, Implement state machine, Implement guard clauses, Emit audit events]
    priority: P0
    points: 3
    sprint: 1
    dependencies: [OPS-001]
    labels: [domain, state-machine]
    security: A rejected transition must never partially persist (transactional guard).
    observability: Transition counter metric labelled by from/to state.
    test_approach: tests/unit/agent/test_state_machine.py — exhaustive matrix over all state pairs.
    implemented_by: [app/agent/state.py, app/agent/state_machine.py]

  # ------------------------------------------------------------------ EPIC-02
  - id: OPS-010
    type: story
    epic: EPIC-02
    summary: Create FastAPI service
    description: As a platform owner I need a reproducible API service with health and readiness signalling.
    acceptance_criteria:
      - Service starts reproducibly (single documented command).
      - GET /health works and is dependency-free.
      - GET /ready works and reports database and LLM readiness.
      - Configuration is environment-driven with no secrets in code.
      - Errors return structured JSON responses with a stable error code.
      - API is versioned under /api/v1.
    subtasks: [Create project, Configure dependency manager, Create FastAPI application, Add configuration, Add health endpoint, Add readiness endpoint, Add API versioning, Add error middleware]
    priority: P0
    points: 5
    sprint: 1
    dependencies: [OPS-001]
    labels: [platform, api]
    security: No secret is ever echoed back; configuration is validated at boot and fails closed.
    observability: /metrics endpoint, request counters and latency histograms.
    test_approach: tests/unit/api + tests/integration/api — health, readiness, structured error shapes, versioning.
    implemented_by: [app/main.py, app/api/router.py, app/core/config.py, app/core/errors.py]

  - id: OPS-011
    type: story
    epic: EPIC-02
    summary: Implement PostgreSQL persistence
    description: As the system of record I need durable, migrated storage for all operational entities.
    acceptance_criteria:
      - Core entities (incidents, evidence, agent runs, state transitions, actions, approvals, verifications, audit events, tool invocations, anomalies) survive an application restart.
      - Schema is applied by versioned migrations.
      - Connection pool is configured and health-checked.
      - Indexes support the query patterns used by the API.
      - Transactions wrap multi-write operations.
    subtasks: [Schema, migrations, ORM/repository layer, connection pool, indexes, transaction handling, integration tests]
    priority: P0
    points: 5
    sprint: 1
    dependencies: [OPS-010]
    labels: [platform, database]
    security: All access is via parameterised SQLAlchemy statements; no string-built SQL.
    observability: DB pool saturation gauge and query failure counter.
    test_approach: tests/integration/database — restart-survival test runs migrations twice against PostgreSQL and re-reads rows.
    implemented_by: [app/persistence/database.py, app/persistence/models, app/persistence/migrations]

  # ------------------------------------------------------------------ EPIC-03
  - id: OPS-020
    type: story
    epic: EPIC-03
    summary: GitHub read integration
    description: As an investigator I need recent commits, pull requests, deployments and repository metadata.
    acceptance_criteria:
      - Agent can retrieve commits, pull requests, deployments and repository metadata.
      - Requests have a timeout, bounded retries with jitter, and rate-limit handling (Retry-After honoured).
      - Failures degrade to a typed integration error and are never reported as empty success.
    subtasks: [HTTP client with retry policy, Rate-limit handling, Commit/PR/deployment mappers, Sandbox provider, Tests]
    priority: P0
    points: 5
    sprint: 2
    dependencies: [OPS-011]
    labels: [integration, github]
    security: Read-only token scope; no write endpoints exist in the adapter.
    observability: github_request_duration_seconds, github_rate_limit_remaining.
    test_approach: tests/integration/github with respx-transported HTTP mocks plus sandbox provider tests.
    implemented_by: [app/integrations/github/client.py]

  - id: OPS-021
    type: story
    epic: EPIC-03
    summary: Jira integration
    description: As an operations team we need incidents mirrored to Jira with attached context.
    acceptance_criteria:
      - Can create, retrieve and update an incident.
      - Can attach relevant context (evidence summary, timeline link).
      - Creation is idempotent — retrying with the same idempotency key returns the original issue.
    subtasks: [Jira client, Idempotency key persistence, Issue mapper, Comment/attachment context, Tests]
    priority: P0
    points: 5
    sprint: 2
    dependencies: [OPS-011]
    labels: [integration, jira]
    security: Credentials come from configuration/secret manager only; tokens never logged.
    observability: jira_request_total labelled by outcome, idempotent_replay_total.
    test_approach: tests/integration/jira — duplicate-call test asserts a single issue key is returned.
    implemented_by: [app/integrations/jira/client.py, app/integrations/idempotency.py]

  - id: OPS-022
    type: story
    epic: EPIC-03
    summary: Slack integration
    description: As an on-call engineer I need structured operational notifications.
    acceptance_criteria:
      - Sends structured notifications with incident id, severity, summary, evidence count and approval link.
      - Delivery failures are surfaced, never swallowed.
      - Payload is size-bounded and sanitises untrusted evidence text.
    subtasks: [Slack client, Block-kit builder, Sanitiser, Retry policy, Tests]
    priority: P0
    points: 3
    sprint: 2
    dependencies: [OPS-011]
    labels: [integration, slack]
    security: Evidence text is sanitised to prevent mention-injection and prompt-injection via chat.
    observability: slack_notify_total, slack_notify_failures_total.
    test_approach: tests/integration/slack — block structure assertions and failure surfacing.
    implemented_by: [app/integrations/slack/client.py]

  - id: OPS-023
    type: story
    epic: EPIC-03
    summary: Metrics and log integration
    description: As a detector I need to query metrics and logs over time windows and services.
    acceptance_criteria:
      - Can query metric series for a service, metric name and time window.
      - Can query logs filtered by service, severity, window and free-text.
      - Time windows are explicit and timezone-safe (UTC).
      - Empty results are distinguishable from failures.
    subtasks: [Metrics provider interface, Logs provider interface, Window helper, Sandbox provider, Tests]
    priority: P0
    points: 5
    sprint: 2
    dependencies: [OPS-011]
    labels: [integration, observability]
    security: Query parameters are validated and length-bounded to prevent injection into upstream query languages.
    observability: provider latency and failure counters.
    test_approach: tests/integration/observability — window semantics, partial data, and failure distinguishability.
    implemented_by: [app/integrations/metrics/provider.py, app/integrations/logs/provider.py]

  # ------------------------------------------------------------------ EPIC-04
  - id: OPS-030
    type: story
    epic: EPIC-04
    summary: Implement anomaly detector
    description: As a detection engine I need deterministic statistical detection for error rate, latency and traffic.
    acceptance_criteria:
      - Supports error_rate, latency_p95 and request_rate families.
      - Uses a deterministic robust-z baseline with a minimum sample size and dir/relative-deviation guard.
      - Produces metric, baseline, observed, deviation, severity and detected_at.
      - Identical input always produces identical output (no LLM involvement).
      - Low-traffic series are marked insufficient_data instead of raising false anomalies.
    subtasks: [Baseline computation, Threshold configuration, Severity mapping, Detector orchestration, Property tests]
    priority: P0
    points: 5
    sprint: 3
    dependencies: [OPS-023]
    labels: [detection, statistics]
    security: Pure function over validated inputs; no external calls.
    observability: anomaly_evaluations_total labelled by outcome.
    test_approach: tests/unit/detection — golden cases plus property test that adding normal traffic does not trigger.
    implemented_by: [app/detection/detector.py, app/detection/baselines.py, app/detection/severity.py]

  - id: OPS-031
    type: story
    epic: EPIC-04
    summary: Create incidents from anomalies
    description: As an operations platform I need anomalies to become deduplicated, notified incidents.
    acceptance_criteria:
      - Duplicate anomalies within the dedup window map to the same incident.
      - Incident severity is assigned from the anomaly severity.
      - The detection event (anomaly row) is persisted and linked to the incident.
      - A notification is emitted exactly once per incident creation.
    subtasks: [Dedup key, Incident factory, Severity assignment, Anomaly persistence, Notification emission]
    priority: P0
    points: 3
    sprint: 3
    dependencies: [OPS-030]
    labels: [detection, incidents]
    security: Incident creation is server-side only; clients cannot set arbitrary severity or suppress dedup.
    observability: incidents_created_total, incidents_deduplicated_total.
    test_approach: tests/unit/detection/test_incident_factory.py and tests/integration for dedup across restarts.
    implemented_by: [app/detection/incident_factory.py, app/application/incident_service.py]

  # ------------------------------------------------------------------ EPIC-05
  - id: OPS-040
    type: story
    epic: EPIC-05
    summary: Build evidence retrieval
    description: As an investigator I need normalised, timestamped, source-labelled evidence linked to the incident.
    acceptance_criteria:
      - Evidence is timestamped, source-labelled, typed and confidence-scored.
      - Evidence is persisted and linked to the incident.
      - Evidence is retrievable by evidence ID.
      - Retrieval continues when a single source fails, recording a degradation note.
    subtasks: [Evidence collector fan-out, Normaliser, Ranking, Persistence, Retrieval API, Degradation handling]
    priority: P0
    points: 8
    sprint: 4
    dependencies: [OPS-020, OPS-021, OPS-022, OPS-023]
    labels: [investigation, evidence]
    security: Evidence content is treated as untrusted data and sanitised/truncated before reaching the LLM.
    observability: evidence_collected_total by source, evidence_source_failures_total.
    test_approach: tests/unit/investigation/test_collector.py — partial-failure and normalisation cases.
    implemented_by: [app/investigation/collector.py, app/investigation/evidence.py]

  - id: OPS-041
    type: story
    epic: EPIC-05
    summary: Implement AI investigation
    description: As an operations engineer I need an evidence-backed diagnosis with explicit confidence.
    acceptance_criteria:
      - Output conforms to the diagnosis schema — hypothesis, evidence_ids, counter_evidence_ids, confidence, recommended_actions.
      - Every referenced evidence id exists, otherwise the diagnosis is rejected.
      - Unsupported claims are not represented as verified facts (unverified claims are labelled and confidence is capped).
      - LLM failure degrades to a deterministic offline diagnosis that is explicitly labelled as such.
    subtasks: [Prompt artefact, LLM adapter, Schema validation, Evidence-reference validation, Offline reasoner, Grounding checks]
    priority: P0
    points: 8
    sprint: 4
    dependencies: [OPS-020, OPS-023, OPS-030, OPS-040]
    labels: [investigation, llm, safety]
    security: Prompt-injection defences; the LLM produces proposals only and never gains authority.
    observability: llm_latency_seconds, llm_error_rate, diagnosis_grounding_failures_total, token usage.
    test_approach: tests/unit/investigation (schema + grounding) and tests/security/prompt_injection.
    implemented_by: [app/investigation/investigator.py, app/llm/provider.py, prompts/investigation/system.md]

  # ------------------------------------------------------------------ EPIC-06
  - id: OPS-050
    type: story
    epic: EPIC-06
    summary: Implement agent state machine
    description: As the agent runtime I need deterministic, persisted, recoverable run state.
    acceptance_criteria:
      - State transitions are deterministic given the same inputs.
      - Invalid transitions are rejected without side effects.
      - State is persisted on every transition with a run record.
      - Interrupted runs recover safely on startup (no duplicated executions).
    subtasks: [Run entity, Transition persistence, Optimistic concurrency, Recovery scan, Tests]
    priority: P0
    points: 8
    sprint: 4
    dependencies: [OPS-002, OPS-041]
    labels: [agent, runtime]
    security: Recovery never re-executes a high-risk action without a fresh policy check.
    observability: agent_run_duration_seconds, agent_run_failure_total, agent_run_recovered_total.
    test_approach: tests/unit/agent/test_run_manager.py — forced failure and recovery idempotency.
    implemented_by: [app/agent/run_manager.py, app/agent/orchestrator.py, app/persistence/repositories/agent_runs.py]

  - id: OPS-051
    type: story
    epic: EPIC-06
    summary: Implement tool registry
    description: As a security boundary I need every agent-reachable operation declared with permissions and risk.
    acceptance_criteria:
      - Every tool declares name, description, input schema, output schema, permissions, risk level, timeout, retry policy and approval requirement.
      - Input is validated against the schema before execution.
      - Unregistered tools cannot be executed (hard failure, audited).
      - Registry is introspectable via the API for audit purposes.
    subtasks: [Tool metadata model, Schema validation, Registry singleton, Permission mapping, Audit hook, Tests]
    priority: P0
    points: 5
    sprint: 5
    dependencies: [OPS-050]
    labels: [agent, security, tools]
    security: This is the tool trust boundary — no shell/SQL/arbitrary HTTP tool exists (rule 7).
    observability: tool_invocations_total by tool and outcome.
    test_approach: tests/unit/tools/test_registry.py — unknown-tool rejection and schema violations.
    implemented_by: [app/tools/registry.py, app/tools/schemas.py, app/tools/permissions.py]

  # ------------------------------------------------------------------ EPIC-07
  - id: OPS-060
    type: story
    epic: EPIC-07
    summary: Build structured action planner
    description: As an agent I need LLM recommendations converted into validated, ordered action requests.
    acceptance_criteria:
      - Free-text LLM output becomes typed action requests referencing registered tools only.
      - Unknown tools or malformed parameters are dropped and recorded as rejected proposals.
      - Proposed actions carry a rationale that references evidence ids.
      - A plan always includes at least one verification expectation.
    subtasks: [Action request model, Mapper, Validator, Rejection recording, Verification expectation, Tests]
    priority: P0
    points: 5
    sprint: 5
    dependencies: [OPS-051]
    labels: [actions, planning]
    security: The planner cannot invent tools; anything unknown is rejected and audited.
    observability: action_plans_total, action_proposals_rejected_total.
    test_approach: tests/unit/actions/test_planner.py — hallucinated tool names and bad params.
    implemented_by: [app/actions/planner.py, app/actions/idempotency.py]

  - id: OPS-061
    type: story
    epic: EPIC-07
    summary: Implement approval gateway
    description: As a risk owner I need high-risk actions to require a recorded human decision.
    acceptance_criteria:
      - High and critical risk actions cannot execute without an approval record.
      - Approvals record actor, role, timestamp, decision, reason and the exact action payload.
      - Approval is bound to the action content hash — a modified action requires a new approval.
      - Rejection and escalation paths are supported.
    subtasks: [Approval entity, Content hashing, Decision endpoints, Escalation, Expiry, Tests]
    priority: P0
    points: 5
    sprint: 5
    dependencies: [OPS-060]
    labels: [approval, safety]
    security: Approval requires the operator/sre/admin role and is invalidated by payload tampering.
    observability: approvals_requested_total, approvals_granted_total, approval_latency_seconds.
    test_approach: tests/unit/actions/test_approval.py + tests/security/authorization/test_bypass.py.
    implemented_by: [app/actions/approval.py, app/api/routes/approvals.py]

  - id: OPS-062
    type: story
    epic: EPIC-07
    summary: Implement action executor
    description: As the runtime I need approved actions executed idempotently with bounded retries.
    acceptance_criteria:
      - MVP tools exist - jira.create_incident, slack.notify, deployment.rollback_simulation (plus knowledge.base_example).
      - Execution is idempotent per idempotency key; a replayed request does not double-execute.
      - Timeouts and retries follow the tool's declared policy.
      - Every attempt is audited with request id, tool, actor and outcome.
    subtasks: [Executor core, Idempotency store, Retry/timeout wiring, Audit emission, Result model]
    priority: P0
    points: 8
    sprint: 5
    dependencies: [OPS-061]
    labels: [actions, execution]
    security: Only registered tools can run; policy is re-checked immediately before execution.
    observability: action_duration_seconds, action_success_rate, action_failures_total.
    test_approach: tests/unit/actions/test_executor.py — idempotent replay and timeout behaviour.
    implemented_by: [app/actions/executor.py, app/actions/audit.py, app/tools/deployment.py]

  - id: OPS-063
    type: story
    epic: EPIC-07
    summary: Implement verification engine
    description: As a safety owner I need independent verification that distinguishes SUCCESS, FAILED and UNKNOWN.
    acceptance_criteria:
      - Expected state is defined before execution (checks with thresholds and windows).
      - Actual state is observed from a source independent of the executor.
      - Outcome is SUCCESS, FAILED or UNKNOWN, never inferred from an HTTP status code.
      - UNKNOWN is used when data is insufficient, with the reason recorded.
      - Verification result drives RESOLVED or ESCALATED.
    subtasks: [Expected-state model, Checks, Independent observer, Outcome evaluation, Resolution wiring, Tests]
    priority: P0
    points: 8
    sprint: 6
    dependencies: [OPS-062]
    labels: [verification, safety]
    security: Verifier never reads the action result as evidence of effect; it re-queries the system of record.
    observability: verification_total by outcome, verification_latency_seconds.
    test_approach: tests/unit/verification — HTTP-200-but-no-effect case must return FAILED.
    implemented_by: [app/verification/engine.py, app/verification/checks.py, app/verification/outcomes.py]

  # ------------------------------------------------------------------ EPIC-08
  - id: SEC-001
    type: story
    epic: EPIC-08
    summary: Threat model
    description: As a security owner I need an explicit threat model across all trust boundaries.
    acceptance_criteria:
      - Threats enumerated for LLM, tools, external inputs, APIs, database, UI and credentials.
      - Each threat has a likelihood/impact rating, mitigation and residual risk.
      - Trust boundaries are diagrammed.
      - Mitigations map to implemented controls and tests.
    subtasks: [Trust boundaries, STRIDE analysis, Mitigation mapping, Residual risk register]
    priority: P0
    points: 5
    sprint: 3
    dependencies: [OPS-010]
    labels: [security, docs]
    security: This story produces the security contract the rest of EPIC-08 implements.
    observability: n/a (documentation), reviewed on every security-relevant PR.
    test_approach: tests/unit/planning/test_documentation.py asserts every threat has a mitigation and control test.
    implemented_by: [docs/security/threat-model.md, docs/security/security-controls.md]

  - id: SEC-002
    type: story
    epic: EPIC-08
    summary: RBAC and least privilege
    description: As a platform owner I need role-based access with tool permissions mapped to roles.
    acceptance_criteria:
      - Roles viewer, operator, sre, admin exist with documented capabilities.
      - Tool permissions map to roles and are enforced server-side on every request and every execution.
      - Missing or invalid credentials return 401; insufficient role returns 403 (both audited).
      - Least-privilege defaults - viewer is read-only, high-risk execution requires sre or admin.
    subtasks: [Role model, Token authentication, Permission matrix, Route guards, Execution guard, Tests]
    priority: P0
    points: 8
    sprint: 7
    dependencies: [OPS-061]
    labels: [security, rbac]
    security: Deny-by-default; unknown role or unknown permission denies.
    observability: auth_failures_total labelled by reason, authorization_denials_total by permission.
    test_approach: tests/security/authorization — matrix test over roles × endpoints × tools.
    implemented_by: [app/core/security.py, app/policy/authorization.py, app/api/dependencies.py]

  - id: SEC-003
    type: story
    epic: EPIC-08
    summary: Prompt-injection defenses
    description: As an AI safety owner I need untrusted content to be unable to change agent authority.
    acceptance_criteria:
      - Malicious logs, GitHub content, Jira content and API responses are tested.
      - Untrusted content is delimited and labelled as data, never as instructions.
      - Directives that try to escalate privileges, skip approval or run unregistered tools are neutralised.
      - Injection attempts are recorded as security events.
    subtasks: [Sanitiser, Untrusted-content framing, Injection detector, Security event recording, Adversarial tests]
    priority: P0
    points: 8
    sprint: 7
    dependencies: [SEC-002, OPS-041]
    labels: [security, llm, adversarial]
    security: Defence in depth — even a fully compromised LLM cannot bypass policy because policy is not LLM-mediated.
    observability: prompt_injection_detected_total, untrusted_content_truncated_total.
    test_approach: tests/security/prompt_injection with a corpus of adversarial payloads injected through every evidence source.
    implemented_by: [app/core/sanitization.py, app/core/security.py, prompts/investigation/system.md]

  - id: SEC-004
    type: story
    epic: EPIC-08
    summary: Audit trail
    description: As an auditor I need every consequential action traceable.
    acceptance_criteria:
      - Records capture actor, timestamp, incident, agent run, tool, action, approval, result.
      - Audit records are append-only — no update or delete API exists.
      - Audit log is queryable by incident, run, actor and time range.
      - Audit records survive restart and include correlation ids.
    subtasks: [Audit entity, Append-only repository, Emission points, Query API, Tamper-evidence hash chain, Tests]
    priority: P0
    points: 5
    sprint: 7
    dependencies: [SEC-002, OPS-062]
    labels: [security, audit]
    security: Hash-chained rows make silent edits detectable.
    observability: audit_events_total by event type.
    test_approach: tests/integration/test_audit.py — append-only enforcement and hash-chain verification.
    implemented_by: [app/actions/audit.py, app/persistence/repositories/audit.py, app/api/routes/audit.py]

  - id: SEC-005
    type: story
    epic: EPIC-08
    summary: Supply-chain controls
    description: As a build owner I need dependency, secret, container and SBOM controls in CI.
    acceptance_criteria:
      - Dependency scanning (pip-audit + Dependabot) runs in CI.
      - Secret scanning (gitleaks) runs in CI and fails on findings.
      - Container scanning (Trivy) runs on the built image.
      - SBOM is generated per build.
      - Dependencies are pinned to exact versions.
    subtasks: [Pin dependencies, pip-audit job, gitleaks job, Trivy job, SBOM artifact, Dependabot config]
    priority: P0
    points: 5
    sprint: 7
    dependencies: [OPS-010]
    labels: [security, supply-chain, ci]
    security: Blocks merges on critical vulnerabilities and any detected secret.
    observability: CI job status is the SLI; artifacts retained per build.
    test_approach: tests/unit/planning/test_supply_chain.py asserts pinned versions and workflow jobs exist.
    implemented_by: [.github/workflows/security.yml, pyproject.toml, .github/dependabot.yml]

  - id: SEC-006
    type: story
    epic: EPIC-08
    summary: API rate limiting and input validation
    description: As a platform owner I need the public API to resist abuse and malformed input.
    acceptance_criteria:
      - Per-token and per-IP request rate limits are enforced and return 429 with Retry-After.
      - All request models reject unknown fields and enforce bounded string lengths and collection sizes.
      - Rejected input is audited and counted, and never reaches a tool or the LLM.
      - Free-text fields destined for external systems are sanitised at the API boundary.
    subtasks: [Rate limit middleware, Token bucket store, Pydantic strict models, Length bounds, Rejection audit, Tests]
    priority: P0
    points: 3
    sprint: 3
    dependencies: [OPS-010]
    labels: [security, api, hardening]
    security: Directly reduces denial-of-service and injection surface of every endpoint.
    observability: rate_limit_rejections_total, validation_rejections_total by route.
    test_approach: tests/security/test_rate_limit.py and tests/security/test_input_validation.py.
    implemented_by: [app/api/middleware/rate_limit.py, app/domain/schemas.py]

  # ------------------------------------------------------------------ EPIC-09
  - id: SRE-001
    type: story
    epic: EPIC-09
    summary: Operational metrics
    description: As an SRE I need golden signals and agent-specific metrics exported.
    acceptance_criteria:
      - Request rate, latency, errors and saturation are exposed.
      - Agent signals exposed - run duration, run failure rate, tool failure rate, investigation duration, action success rate, verification success rate, escalation rate, unsafe action attempts, LLM latency/error rate, token usage.
      - Metrics endpoint is scrapeable at /metrics and excludes high-cardinality labels.
    subtasks: [Prometheus registry, HTTP middleware metrics, Agent metrics, SLO metrics, Documentation]
    priority: P0
    points: 5
    sprint: 3
    dependencies: [OPS-010]
    labels: [sre, observability]
    security: Metrics endpoint exposes no secrets, tokens or evidence content.
    observability: This story is the observability surface.
    test_approach: tests/integration/test_observability.py — scrape text contains required series after exercising the API.
    implemented_by: [app/core/telemetry.py, app/api/routes/health.py]

  - id: SRE-002
    type: story
    epic: EPIC-09
    summary: Structured logging
    description: As an on-call engineer I need every operation correlated by request, trace, incident and run id.
    acceptance_criteria:
      - Every log line carries request_id, trace_id and, where applicable, incident_id and agent_run_id.
      - Logs are JSON in staging/production and human-readable in development.
      - Secrets and tokens are redacted by a logging processor.
    subtasks: [structlog configuration, Correlation ContextVar, Redaction processor, Middleware binding]
    priority: P0
    points: 3
    sprint: 2
    dependencies: [OPS-010]
    labels: [sre, logging]
    security: Redaction processor removes authorisation headers and configured secret keys.
    observability: Log-based SLI for errors.
    test_approach: tests/unit/core/test_logging.py — context propagation and redaction.
    implemented_by: [app/core/logging.py]

  - id: SRE-003
    type: story
    epic: EPIC-09
    summary: Distributed tracing
    description: As an engineer I need to trace an entire incident lifecycle end to end.
    acceptance_criteria:
      - A trace covers detection, evidence retrieval, LLM call, policy, approval, execution and verification.
      - Spans carry incident_id and agent_run_id attributes.
      - Trace context propagates across the API and outbound integration calls.
      - Tracing is vendor-neutral via OpenTelemetry with an in-memory exporter in tests.
    subtasks: [Tracer provider, Span helper, Attribute conventions, Outbound propagation, Test exporter]
    priority: P0
    points: 5
    sprint: 6
    dependencies: [SRE-001]
    labels: [sre, tracing]
    security: Span attributes exclude evidence content and credentials.
    observability: This story is the tracing surface.
    test_approach: tests/integration/test_tracing.py asserts a single trace spans the lifecycle stages.
    implemented_by: [app/core/tracing.py, app/agent/orchestrator.py]

  - id: SRE-004
    type: story
    epic: EPIC-09
    summary: SLO dashboard
    description: As a service owner I need documented SLOs backed by measurable indicators.
    acceptance_criteria:
      - SLOs documented — API availability >= 99.5%, detection latency < 60s, investigation < 120s, verification < 30s, tool success >= 99%, zero lost critical incidents, zero unauthorised high-risk actions.
      - Each SLO has an SLI computed from emitted metrics.
      - Dashboard/alert rules exist as versioned artefacts.
      - Targets are labelled as initial targets to be validated.
    subtasks: [SLO definitions, SLI metric mapping, Prometheus rules, Dashboard definition, Error budget policy]
    priority: P0
    points: 5
    sprint: 3
    dependencies: [SRE-001]
    labels: [sre, slo]
    security: The 'zero unauthorised high-risk actions' SLI is a security SLI and is alerted on.
    observability: This story is the SLO surface.
    test_approach: tests/unit/planning/test_documentation.py — every documented SLO maps to a metric name present in telemetry.
    implemented_by: [docs/sre/slos.md, infra/deployment/prometheus/rules.yml, infra/deployment/grafana/dashboard.json]

  - id: SRE-005
    type: story
    epic: EPIC-09
    summary: Runbooks
    description: As an on-call engineer I need runbooks for the known failure modes.
    acceptance_criteria:
      - Runbooks exist for database failure, LLM failure, GitHub failure, Jira failure, excessive agent errors and unsafe agent behaviour.
      - Each runbook has symptoms, impact, diagnosis, mitigation and verification steps.
      - Runbooks reference real endpoints and metrics shipped in this repository.
    subtasks: [Database runbook, LLM runbook, GitHub runbook, Jira runbook, Agent-error runbook, Unsafe-behaviour runbook]
    priority: P0
    points: 3
    sprint: 6
    dependencies: [SRE-001]
    labels: [sre, runbook, docs]
    security: The unsafe-behaviour runbook includes how to force the agent into observe_only autonomy.
    observability: Each runbook lists the metrics and log queries used for detection.
    test_approach: tests/unit/planning/test_documentation.py — required sections present, referenced endpoints exist in the router.
    implemented_by: [docs/sre/runbooks/]

  # ------------------------------------------------------------------ EPIC-10
  - id: DEV-001
    type: story
    epic: EPIC-10
    summary: Dockerize application
    description: As an operator I need a reproducible, non-root, multi-stage container image.
    acceptance_criteria:
      - Multi-stage Dockerfile builds a slim runtime image.
      - Container runs as a non-root user with a healthcheck.
      - docker-compose brings up app plus PostgreSQL with migrations applied.
      - .dockerignore excludes secrets and test artefacts.
    subtasks: [Runtime Dockerfile, Test Dockerfile, Compose stack, Healthcheck, Local scripts]
    priority: P0
    points: 3
    sprint: 1
    dependencies: [OPS-010]
    labels: [devops, docker]
    security: No secrets baked into layers; runs as UID 10001; pinned base image digest family.
    observability: Container healthcheck hits /health; compose exports metrics port.
    test_approach: Docker is unavailable in the CI sandbox, so tests/unit/planning/test_infra.py statically validates the Dockerfile/compose contract (non-root, healthcheck, no secrets, migration entrypoint).
    implemented_by: [infra/docker/Dockerfile, infra/compose/docker-compose.yml]

  - id: DEV-002
    type: story
    epic: EPIC-10
    summary: Build CI pipeline
    description: As a developer I need every pull request gated by quality, security and AI evaluation.
    acceptance_criteria:
      - Pipeline runs lint, format check, type check, unit tests, integration tests (real PostgreSQL), security scans, AI evaluation and container build.
      - Any failing stage fails the pipeline and blocks merge.
      - The pipeline is reproducible locally through a single documented command.
      - Coverage report is produced and a floor is enforced.
    subtasks: [ci.yml, Local make targets, Coverage gate, Integration Postgres service, Artifact upload]
    priority: P0
    points: 5
    sprint: 1
    dependencies: [OPS-010]
    labels: [devops, ci]
    security: Security stage blocks on high/critical findings.
    observability: Pipeline duration and failure reasons are visible in the PR checks view.
    test_approach: tests/unit/planning/test_supply_chain.py — workflow files parse, contain required jobs, and reference real commands.
    implemented_by: [.github/workflows/ci.yml, Makefile, scripts/ci.sh]

  - id: DEV-003
    type: story
    epic: EPIC-10
    summary: Build CD pipeline
    description: As a release owner I need an immutable-artifact deployment with staged gates.
    acceptance_criteria:
      - Build produces an immutable versioned artifact (image tagged with the commit SHA).
      - Staging deploy runs smoke tests, integration tests and the AI regression suite.
      - Production deploy requires an explicit approval environment.
      - Post-deploy health, readiness and release verification run automatically.
    subtasks: [cd.yml, Staging deploy, Smoke tests, AI regression gate, Production approval, Release verification]
    priority: P0
    points: 5
    sprint: 8
    dependencies: [DEV-002]
    labels: [devops, cd]
    security: Production secrets are environment-scoped and never echoed.
    observability: Post-deploy verification queries /ready, /metrics and the SLO series.
    test_approach: scripts/verify_release.py is exercised by tests/unit/planning/test_release_verification.py against a live app instance.
    implemented_by: [.github/workflows/cd.yml, scripts/verify_release.py, infra/deployment/]

  - id: DEV-004
    type: story
    epic: EPIC-10
    summary: Implement and test rollback
    description: As an SRE I need rollback that is exercised, not just documented.
    acceptance_criteria:
      - Rollback procedure is versioned in the repository.
      - Rollback is executed in a test/staging context by an automated test or script.
      - Post-rollback health checks and metric comparison run and their result is recorded.
      - Rollback of a simulated bad deployment is verified as recovery.
    subtasks: [Rollback runbook, Rollback script, Staging rollback drill, Verification of recovery, Incident creation on rollback]
    priority: P0
    points: 5
    sprint: 6
    dependencies: [DEV-001, OPS-063]
    labels: [devops, reliability, rollback]
    security: Rollback target version is validated against an allow-list of previously released SHAs.
    observability: Rollback emits a release event and compares before/after metric windows.
    test_approach: tests/e2e/test_rollback_drill.py drives scripts/rollback_drill.py end to end and asserts recovery verification.
    implemented_by: [scripts/rollback_drill.py, docs/sre/runbooks/deployment-rollback.md]

  # ------------------------------------------------------------------ EPIC-11
  - id: EVAL-001
    type: story
    epic: EPIC-11
    summary: Build evaluation dataset
    description: As an AI engineer I need a golden dataset covering normal, anomalous, ambiguous and adversarial cases.
    acceptance_criteria:
      - Dataset covers normal, simple anomaly, ambiguous anomaly, multiple causes, false positive, tool failure and malicious input.
      - Each case defines input state, expected evidence, acceptable and unacceptable hypotheses, acceptable and unsafe actions, and expected verification.
      - Dataset is versioned and validated by a schema.
    subtasks: [Dataset schema, Seed cases per category, Dataset validation test, Documentation]
    priority: P0
    points: 5
    sprint: 8
    dependencies: [OPS-041]
    labels: [eval, ai]
    security: The adversarial category is the regression net for SEC-003.
    observability: Dataset size and category coverage reported by the harness.
    test_approach: tests/unit/eval/test_dataset.py validates schema and category coverage.
    implemented_by: [evals/datasets/, evals/config.yaml]

  - id: EVAL-002
    type: story
    epic: EPIC-11
    summary: Build evaluation harness
    description: As an AI engineer I need automated grading of detection, evidence, diagnosis, action selection, safety and verification.
    acceptance_criteria:
      - Harness evaluates detection, evidence retrieval, diagnosis, action selection, safety and verification.
      - Graders are deterministic and produce per-case and aggregate scores.
      - Safety violations (unsafe action proposed or approval bypassed) fail the run outright.
      - Harness writes a machine-readable report artefact.
    subtasks: [Runner, Graders, Metrics aggregation, Report writer, CI integration]
    priority: P0
    points: 8
    sprint: 8
    dependencies: [EVAL-001]
    labels: [eval, ai, ci]
    security: Safety grader is a hard gate, not a weighted score.
    observability: Eval report is uploaded as a CI artefact and summarised in the job summary.
    test_approach: tests/unit/eval/test_graders.py — known-good and known-bad agent outputs are graded correctly.
    implemented_by: [evals/runner.py, evals/graders/, app/evaluation]

  - id: EVAL-003
    type: story
    epic: EPIC-11
    summary: AI regression testing
    description: As a release owner I need merges blocked when critical AI metrics regress.
    acceptance_criteria:
      - Baseline metrics are stored in the repository.
      - A regression beyond thresholds (accuracy, safety, grounding, action-selection) fails the pipeline.
      - The check is required on main by branch protection documentation.
      - Thresholds are configurable and documented.
    subtasks: [Baseline artefact, Threshold config, Regression comparator, CI job, Documentation]
    priority: P0
    points: 5
    sprint: 8
    dependencies: [EVAL-002]
    labels: [eval, ci, quality]
    security: Safety-regression threshold is zero-tolerance.
    observability: Regression deltas are printed in the CI summary.
    test_approach: tests/unit/eval/test_regression.py — a deliberately degraded result set must be reported as a regression.
    implemented_by: [evals/baselines/baseline.json, evals/regression.py, .github/workflows/ai-evaluation.yml]

  # ------------------------------------------------------------------ EPIC-12
  - id: UI-001
    type: story
    epic: EPIC-12
    summary: Incident dashboard
    description: As an operator I need to see incident severity, status, timeline, evidence, diagnosis, actions and verification.
    acceptance_criteria:
      - List and detail views show severity, status and timestamps.
      - Detail view shows the timeline, evidence with source labels, diagnosis with referenced evidence, proposed actions and verification outcome.
      - UI reads exclusively from the public API.
      - Empty and error states are handled explicitly.
    subtasks: [Static shell, API client, Incident list, Incident detail, Timeline view, Error handling]
    priority: P1
    points: 5
    sprint: 9
    dependencies: [OPS-063, SEC-004]
    labels: [ui]
    security: No token is embedded in served assets; the operator supplies a token at runtime and it is kept in memory.
    observability: UI renders the same ids used in logs and traces for correlation.
    test_approach: tests/integration/ui/test_ui_serving.py — assets are served, reference only the public API, and contain no secrets.
    implemented_by: [app/ui/static/, app/api/routes/ui.py]

  - id: UI-002
    type: story
    epic: EPIC-12
    summary: Approval interface
    description: As an operator I need to approve, reject or escalate a proposed action.
    acceptance_criteria:
      - Pending approvals are listed with the exact action payload and risk level.
      - Operator can approve, reject (with reason) or escalate.
      - Role restrictions are enforced by the API, not the UI.
      - The decision is reflected in the audit trail and the incident timeline immediately.
    subtasks: [Pending list, Decision actions, Reason capture, RBAC-aware messaging, Audit verification]
    priority: P1
    points: 5
    sprint: 9
    dependencies: [UI-001, SEC-002]
    labels: [ui, approvals]
    security: UI never claims authority it does not have — all enforcement remains server-side.
    observability: Approval decisions emit audit events and metrics identical to API-driven decisions.
    test_approach: tests/integration/ui/test_ui_serving.py asserts the approval flow calls only the approval endpoints.
    implemented_by: [app/ui/static/app.js, app/api/routes/ui.py]

  - id: UI-003
    type: story
    epic: EPIC-12
    summary: Agent activity view
    description: As an SRE I need the agent operational trace Observed -> Investigated -> Reasoned -> Proposed -> Approved -> Executed -> Verified.
    acceptance_criteria:
      - The activity view renders each lifecycle stage with timestamp, duration and outcome.
      - Tool invocations are listed with tool name, risk, and result.
      - Failed and escalated runs are visually distinct.
    subtasks: [Run timeline component, Tool invocation list, Failure styling]
    priority: P1
    points: 3
    sprint: 9
    dependencies: [UI-001, SRE-003]
    labels: [ui, observability]
    security: Rendered evidence text is escaped to prevent stored XSS from untrusted log content.
    observability: The view mirrors the trace data used in SRE-003.
    test_approach: tests/integration/ui/test_ui_serving.py asserts the rendered builder escapes HTML.
    implemented_by: [app/ui/static/app.js]

  - id: OPS-070
    type: story
    epic: EPIC-12
    summary: Final hardening and release validation
    description: As a release owner I need the final gates executed against the release candidate.
    acceptance_criteria:
      - All functional, quality, security, reliability, operations and release gates in section 38 are satisfied and evidenced.
      - End-to-end production simulation passes for all three MVP scenarios.
      - Release verification script passes against the running candidate.
      - Version is tagged and CHANGELOG updated.
    subtasks: [Gate review, E2E simulation, Release verification, Tag and changelog, Post-release monitoring check]
    priority: P0
    points: 5
    sprint: 9
    dependencies: [EVAL-003, DEV-003, UI-002, UI-003]
    labels: [release, hardening]
    security: Final gate includes zero critical vulnerabilities, no leaked secrets, verified RBAC and passing prompt-injection tests.
    observability: Post-release monitoring checklist executed against emitted metrics.
    test_approach: scripts/verify_release.py plus tests/e2e/test_production_simulation.py across all three scenarios.
    implemented_by: [scripts/verify_release.py, docs/planning/release-v1.0.0.md, CHANGELOG.md]

