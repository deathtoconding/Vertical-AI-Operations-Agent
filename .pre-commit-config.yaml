# SEC-005 / DEV-002 — pre-commit configuration.
#
# The point of this file is that the cheap checks run *before* a commit exists, so a secret or a
# conflict marker never reaches CI at all. Every hook here has a blocking counterpart in the
# pipelines (.github/workflows/ci.yml, security.yml); this is the fast feedback loop, not a
# replacement for them.
#
# Install once per clone:  pre-commit install
default_language_version:
  python: python3.11

repos:
  # ------------------------------------------------------------------------- #
  # Generic hygiene
  # ------------------------------------------------------------------------- #
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.lock$
      - id: detect-private-key
      - id: forbid-submodules

  # ------------------------------------------------------------------------- #
  # Secret scanning — the same rule set CI uses, so local and CI cannot disagree.
  # ------------------------------------------------------------------------- #
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: gitleaks (configs/gitleaks.toml)
        args: ["--config=configs/gitleaks.toml", "--verbose", "--redact"]

  # ------------------------------------------------------------------------- #
  # Format and lint (pinned to the same versions as pyproject.toml)
  # ------------------------------------------------------------------------- #
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # ------------------------------------------------------------------------- #
  # Repository rules that are cheaper to state as a script than as a hook
  # ------------------------------------------------------------------------- #
  - repo: local
    hooks:
      - id: aiops-repo-hygiene
        name: repository hygiene (conflict markers, large files, no shell in app/)
        entry: bash scripts/check_repo_hygiene.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: aiops-offline-secret-scan
        name: offline secret scan (scripts/scan_secrets.sh)
        entry: bash scripts/scan_secrets.sh
        language: system
        pass_filenames: false
        always_run: true
