# Prometheus scrape configuration used by infra/compose/docker-compose.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: aiops-agent

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: aiops-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
