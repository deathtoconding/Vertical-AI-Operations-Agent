# SRE-004 — Grafana datasource provisioning.
#
# Provisioned as code so the SLO dashboard cannot point at the wrong Prometheus after a rebuild,
# and so a fresh environment has a working dashboard without a manual click-through.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Service name from infra/compose/docker-compose.yml; the dashboard's panels are only as
    # trustworthy as this URL.
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
